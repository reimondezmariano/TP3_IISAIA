services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: guardia
      POSTGRES_PASSWORD: guardia
      POSTGRES_DB: guardia
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardia"]
      interval: 2s
      timeout: 3s
      retries: 15
